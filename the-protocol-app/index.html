<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Protocol">
<meta name="theme-color" content="#fffdf8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:#fbf3e4}</style>
<title>The Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-sized app on a cream ground. Cartoon outlines (ink), one saturated colour per tool and per idea, rainbow reserved for primary actions. */
:root{
  --ink:#17163a; --paper:#fffdf8; --cream:#fbf3e4; --soft:#5b587d;
  --coral:#ff5d6c; --orange:#ff9a3d; --sun:#ffd23f; --leaf:#43cf7e; --aqua:#27c5d3; --sky:#3d9bff; --grape:#8b5cf6; --pink:#f45fb0;
  --t-coral:#ffe1e4; --t-orange:#ffeacf; --t-sun:#fff3bf; --t-leaf:#dcf7e6; --t-aqua:#d6f5f8; --t-sky:#dcecff; --t-grape:#e9e0ff; --t-pink:#ffe0f0;
  --rainbow:linear-gradient(95deg,#ff5d6c,#ff9a3d 18%,#ffd23f 34%,#43cf7e 50%,#27c5d3 64%,#3d9bff 78%,#8b5cf6 90%,#f45fb0);
  --f:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bw:2.5px; --sh:0 4px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:var(--f)}
html,body{height:100%}
body{margin:0;color:var(--ink);background-color:var(--cream);
  background-image:radial-gradient(circle at 10% 6%,#ffd9de,transparent 42%),radial-gradient(circle at 92% 10%,#cfe6ff,transparent 38%),radial-gradient(circle at 18% 96%,#e6d9ff,transparent 40%);
  display:grid;place-items:center;padding-inline:16px;padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.device{position:relative;width:390px;max-width:100%;height:min(844px,calc(100dvh - 32px));background:var(--paper);border:8px solid #16121f;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 80px -28px rgba(60,30,90,.45)}
@media(max-width:430px){body{padding-inline:0;padding-block:0;display:block}.device{width:100%;height:100%;border:0;border-radius:0}}

/* header */
.top{flex:0 0 auto;margin:14px 14px 0;padding:8px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(95deg,#fff 0,#fff3f8 55%,#eaf4ff);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:var(--sh);position:relative;z-index:5;color:var(--ink)}
.ib{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--sun);display:none;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 var(--ink);transition:transform .12s}
.ib.show{display:flex}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib.home{display:flex;margin-left:auto;width:42px;height:42px;border-radius:14px;background:linear-gradient(160deg,#ffe9a8,#ffc7d1)}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.logo{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:var(--bw) solid var(--ink);background:conic-gradient(#ff5d6c,#ffd23f,#43cf7e,#3d9bff,#8b5cf6,#f45fb0,#ff5d6c);display:grid;place-items:center}
.logo::after{content:"∞";width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.4px;line-height:1.05;color:var(--ink)}
.brand .tx span{display:block;font-size:13px;font-weight:500;color:var(--ink);line-height:1.1}

/* stage + views */
.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;padding:16px 16px 18px;overflow-y:auto;opacity:0;pointer-events:none;transform:translateX(14px);transition:opacity .28s,transform .28s cubic-bezier(.25,.8,.35,1);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{opacity:1;pointer-events:auto;transform:none}
.fit{display:flex;flex-direction:column;gap:14px;min-height:100%;width:100%}
.grow{flex:1 1 auto}
.title{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.3px;text-wrap:balance}
.center{text-align:center}
.gtext{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.cta{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--rainbow);color:#fff;font-size:16px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;text-shadow:0 1px 0 rgba(23,22,58,.65),0 0 6px rgba(23,22,58,.35);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;flex:0 0 auto}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cta.sm{height:42px;font-size:14.5px}
.cta .q{font-size:20px;line-height:1;opacity:.9}
.cta.alt{background:#fff;color:var(--ink);text-shadow:none;letter-spacing:.4px;text-transform:none;font-size:16px}
.cta svg{width:18px;height:18px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tri button{min-width:0}
.tri button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border:var(--bw) solid var(--ink);border-radius:18px;box-shadow:var(--sh);color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 0 rgba(23,22,58,.45);transition:transform .12s,box-shadow .12s}
.tri button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tri .ic{font-size:26px;line-height:1;filter:drop-shadow(0 1px 0 rgba(23,22,58,.35))}
.tri .t1{background:linear-gradient(160deg,#ff7ac0,#e8449f)}
.tri .t2{background:linear-gradient(160deg,#58b0ff,#2f86f0)}
.tri .t3{background:linear-gradient(160deg,#ffe066,#ffb92e);color:var(--ink);text-shadow:none}
.tri .t3 .ic{filter:none}

/* home */
.hello{font-size:30px;font-weight:700;line-height:1.05}
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);padding:14px}
.bar-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.bar-top b{font-size:18px;font-weight:600}
.bar-top span{font-size:15px;font-weight:600;color:var(--soft)}
.track{height:18px;border:var(--bw) solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--rainbow);background-size:300px 100%;transition:width .7s cubic-bezier(.3,1.2,.4,1)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.bd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:500;text-align:center;line-height:1.1}
.bd .c{position:relative;width:54px;height:54px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:26px;background:var(--bg);box-shadow:0 3px 0 var(--ink)}
.bd.off .c{background:#ecebf2;box-shadow:none;border-style:dashed;border-color:#a9a6c0}
.bd.off .c span{filter:grayscale(1);opacity:.35}
.bd.off{color:#8a87a6}
.bd.off .c::after{content:"🔒";position:absolute;right:-6px;bottom:-6px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--bw) solid var(--ink);border-radius:18px;font-weight:500;font-size:13.5px;color:var(--soft);line-height:1.1}
.stat b{display:block;font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .e{font-size:26px}
.tools{display:flex;flex-direction:column;gap:12px}
.tool{display:grid;grid-template-columns:76px 1fr 22px;gap:12px;align-items:center;padding:12px;border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);text-align:left;width:100%;transition:transform .12s,box-shadow .12s}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool .tile{width:76px;height:76px;border-radius:20px;border:var(--bw) solid var(--ink);display:grid;place-items:center;background:var(--tc)}
.tool .tile svg{width:62px;height:62px}
.tool .tile .fl{font-size:44px;line-height:1}
.tool b{display:block;font-size:22px;font-weight:700;line-height:1.05}
.tool span{display:block;font-size:14px;font-weight:400;color:var(--ink);opacity:.75;line-height:1.2;margin-top:3px}
.tool em{font-style:normal;font-size:26px;font-weight:700}
.motto{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--soft);text-align:center}

/* landing */
.land{align-items:stretch}
.hero{display:grid;place-items:center;flex:1 1 auto;min-height:150px}
.hero svg{width:min(240px,100%);height:auto;max-height:100%;aspect-ratio:1;animation:float 5s ease-in-out infinite}
.hero .flame{width:190px;height:190px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:104px;line-height:1;background:radial-gradient(circle at 35% 30%,#fff3d6,#ffc58a 55%,#ff9a3d);box-shadow:var(--sh);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub2{font-size:20px;font-weight:500;line-height:1.25;text-align:center}

/* info pages */
.pagehead{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:var(--bw) solid var(--ink);border-radius:99px;font-size:13.5px;font-weight:600;background:var(--cb);box-shadow:0 2px 0 var(--ink)}
.lead{font-size:16px;line-height:1.4;color:var(--soft);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ben{display:flex;flex-direction:column;gap:8px;padding:14px;border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);background:var(--bt)}
.ben .e{width:48px;height:48px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:25px;background:var(--bs)}
.ben b{font-size:17px;font-weight:600;line-height:1.1}
.ben p{font-size:14px;line-height:1.3;color:var(--soft)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:0 3px 0 var(--ink);background:var(--bt)}
.row .n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:18px;font-weight:700;background:var(--bs);color:var(--ink)}
.row .e{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:22px;background:var(--bs)}
.row b{display:block;font-size:16px;font-weight:600;line-height:1.1}
.row p{font-size:13.5px;line-height:1.3;color:var(--soft);margin-top:2px}

/* pick */
.pick{display:flex;flex-direction:column;gap:12px;padding:14px;border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh)}
.pick .hd{display:flex;align-items:center;gap:12px}
.pick .hd .e{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:28px;background:#fff}
.pick .hd b{display:block;font-size:20px;font-weight:700;line-height:1.05}
.pick .hd span{font-size:14px;color:var(--soft);font-weight:400}
.durs{display:flex;gap:8px}
.durs button{flex:1;padding:8px 0;border:var(--bw) solid var(--ink);border-radius:14px;background:#fff;font-size:16px;font-weight:600;transition:transform .12s}
.durs button.on{background:var(--ink);color:#fff;transform:translateY(-2px)}

/* session */
.orbwrap{position:relative;width:270px;height:270px;margin:0 auto}
.orbwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orbcore{position:absolute;left:35px;top:35px;width:200px;height:200px;border-radius:50%;border:var(--bw) solid var(--ink);background:radial-gradient(circle at 34% 28%,#fff 0,#e6dcff 32%,#a9d0ff 68%,#8fe3cf 100%);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;transition:transform .25s linear}
.orbcore.calm{animation:breathe 9s ease-in-out infinite}
.orbcore.pauseanim{animation-play-state:paused}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1)}}
.orbcore .tm{font-size:54px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.orbcore .ts{font-size:14px;font-weight:500;color:var(--soft);margin-top:4px}
.phase{font-size:28px;font-weight:700;text-align:center;min-height:36px}
.cap{font-size:17px;line-height:1.4;text-align:center;color:var(--soft);min-height:72px;padding-inline:6px;text-wrap:balance}
.ctrls{display:flex;align-items:center;justify-content:center;gap:18px}
.rb{width:52px;height:52px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.rb:active{transform:translateY(3px);box-shadow:none}
.rb.big{width:72px;height:72px;font-size:30px;background:var(--sun)}
.rb.v{background:var(--t-sky)}
.rb.x{background:var(--t-coral)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;border:var(--bw) solid var(--ink);background:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1}
.dots i.on{background:var(--coral)}
.note{font-size:13px;color:var(--soft);text-align:center}

/* end */
.endhead{display:flex;align-items:center;gap:6px}
.endhead svg{flex:0 0 auto;width:108px;height:108px}
.endhead h1{font-size:32px;font-weight:700;line-height:1.05}
.endhead p{font-size:15px;color:var(--soft);line-height:1.3;margin-top:4px}
.congrats{background:linear-gradient(135deg,#fff,#ffe5ef 70%,#ffd9e3)}
.congrats h2{font-size:21px;font-weight:700;margin-bottom:4px}
.congrats p{font-size:15px;line-height:1.35;color:var(--soft)}
.sect{font-size:17px;font-weight:600;margin-bottom:10px}
.feel4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feel4 div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--bt);text-align:center;font-size:12.5px;font-weight:600;line-height:1.1}
.feel4 .e{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:21px;background:var(--bs)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.faces button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border:var(--bw) solid var(--ink);border-radius:14px;background:#fff;font-size:11.5px;font-weight:600;line-height:1.05;transition:transform .12s,background .15s}
.faces button .e{font-size:26px;line-height:1}
.faces button.on{background:var(--t-sky);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.faces button.on::after{content:"✓";position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--sky);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.facts div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--bt);font-size:12px;font-weight:500;color:var(--soft)}
.facts b{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}

/* modal */
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(23,22,58,.55)}
.modal.on{display:flex}
.mcard{position:relative;width:100%;max-width:320px;padding:26px 20px 20px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);text-align:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mbadge{position:relative;width:132px;height:132px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--ink);background:var(--bg);display:grid;place-items:center;font-size:68px;box-shadow:0 6px 0 var(--ink)}
.mbadge::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed var(--bd);animation:spin 14s linear infinite}
.mcard h2{font-size:28px;font-weight:700}
.mcard p{font-size:16px;color:var(--soft);line-height:1.35;margin:6px 0 16px}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:28px}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear infinite}
@keyframes fall{to{transform:translateY(420px) rotate(540deg)}}

/* v2 */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes flick{0%,100%{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg)) scale(1)}35%{transform:translate(var(--x),calc(var(--y) - 8px)) rotate(calc(var(--r,0deg) + 7deg)) scale(1.18)}70%{transform:translate(var(--x),calc(var(--y) - 2px)) rotate(calc(var(--r,0deg) - 6deg)) scale(.9)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
.view.on .fit>*,.view.on .stag>*{animation:rise .5s cubic-bezier(.3,1.2,.5,1) both}
.view.on .fit>*:nth-child(2),.view.on .stag>*:nth-child(2){animation-delay:.07s}
.view.on .fit>*:nth-child(3),.view.on .stag>*:nth-child(3){animation-delay:.14s}
.view.on .fit>*:nth-child(4),.view.on .stag>*:nth-child(4){animation-delay:.21s}
.view.on .fit>*:nth-child(5),.view.on .stag>*:nth-child(5){animation-delay:.28s}
.view.on .fit>*:nth-child(6),.view.on .stag>*:nth-child(6){animation-delay:.35s}
.view.on .stag>*:nth-child(7){animation-delay:.42s}
.tri .ic{animation:bob 2.6s ease-in-out infinite}.tri .t2 .ic{animation-delay:.3s}.tri .t3 .ic{animation-delay:.6s}
.ptitle{font-size:28px;font-weight:700;line-height:1.05;padding-top:4px}
/* home pet */
.pet{display:flex;flex-direction:column;align-items:center;gap:0}
.pet svg{width:190px;height:190px;animation:float 4.5s ease-in-out infinite;cursor:pointer}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.pet .arm{transform-box:fill-box;transform-origin:20% 90%;animation:wave 1.8s ease-in-out infinite}
.pet .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
.pet .tw:nth-of-type(2){animation-delay:.7s}.pet .tw:nth-of-type(3){animation-delay:1.3s}
.bubble{position:relative;width:100%;margin-top:6px;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:22px;background:#fff;box-shadow:var(--sh);text-align:center;font-size:16px;line-height:1.3;cursor:pointer}
.bubble::before{content:"";position:absolute;left:50%;top:-11px;width:18px;height:18px;margin-left:-9px;background:#fff;border:var(--bw) solid var(--ink);border-right:0;border-bottom:0;transform:rotate(45deg)}
.bubble b{display:block;font-size:18px;margin-bottom:2px}
.bubble small{display:block;margin-top:5px;font-size:12.5px;color:var(--soft)}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh);text-align:left;transition:transform .12s,box-shadow .12s}

function save(d){MEM=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function stats(d){d=d||load();var s={med:0,pom:0,all:0,min:0};d.sessions.forEach(function(x){s.all++;s.min+=x.min;if(x.type==='pom')s.pom++;else s.med++});return s}

function openInfo(k,page){

    var x=T.disc[+b.dataset.i],c=TINT[x[3]],d=$('detail');d.style.setProperty('--bt',c[0]);d.innerHTML='<b>'+x[0]+' '+x[1]+'</b>'+x[4];d.classList.remove('pop');void d.offsetWidth;d.classList.add('pop')}});

/* ---------- pick ---------- */
var scanMin=5;
$('durs').onclick=function(e){var b=e.target.closest('button');if(!b)return;scanMin=+b.dataset.m;[].forEach.call($('durs').children,function(x){x.classList.toggle('on',x===b)})};
$('pickBack').onclick=back;
$('goBreath').onclick=function(){startRun({type:'breath',total:300,min:5,chip:'🌊 Respiration 3·6·5',voice:false})};
$('goScan').onclick=function(){startRun({type:'scan',total:scanMin*60,min:scanMin,chip:'🧘 Scan du corps',voice:true})};

/* ---------- session engine ---------- */
var R=null,VOICE=true,SPEED=1;
function pickVoice(){
  if(!('speechSynthesis' in window))return null;
  var vs=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang)});
  var f=vs.filter(function(v){return /(am[ée]lie|audrey|marie|julie|denise|e?loise|c[ée]line|aur[ée]lie|virginie|female|femme|google fran)/i.test(v.name)&&!/(thomas|paul|henri|claude|male\b|homme)/i.test(v.name)});
  return f[0]||vs.filter(function(v){return !/(thomas|paul|henri|claude)/i.test(v.name)})[0]||vs[0]||null
}
function say(t){
  if(!VOICE||!('speechSynthesis' in window))return;
  try{var u=new SpeechSynthesisUtterance(t),v=pickVoice();u.lang='fr-FR';if(v)u.voice=v;u.rate=.82;u.pitch=1.08;u.volume=1;speechSynthesis.speak(u)}catch(e){}
}
function hush(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){}}catch(e){}}

function startRun(cfg){
  stopRun(true);
  SPEED=window.__speed||1;
  R=Object.assign({el:0,paused:false,last:performance.now(),fired:{}},cfg);
  var core=$('sCore');core.className='orbcore'+(cfg.type==='scan'?' calm':'');core.style.transform='';
  $('sChip').textContent=cfg.chip;
  $('sVoice').style.display=cfg.voice?'':'none';$('v-sess').classList.toggle('br',cfg.type==='breath');$('dev').classList.toggle('tiding',cfg.type==='breath');$('tide').style.height='0';$('tide').classList.remove('out');
  $('sVoice').textContent=VOICE?'🔊':'🔇';
  $('sDots').hidden=cfg.type!=='pomo';
  $('sPause').textContent='⏸';
  $('sNote').textContent=cfg.type==='scan'?(('speechSynthesis' in window)?'La voix te guide. Tu peux aussi suivre les phrases à l’écran.':'Suis les phrases à l’écran.'):cfg.type==='breath'?'Inspire par le nez, expire doucement.':'';$('sClock').textContent='';$('sCyc').textContent='';
  $('sCap').textContent=cfg.type==='scan'?'Installe-toi confortablement…':'';
  $('sPhase').textContent='';
  go('sess');
  R.raf=requestAnimationFrame(loop);
}
function stopRun(silent){if(R){cancelAnimationFrame(R.raf);if(R.type==='scan')hush();R=null}}
function setProg(p){$('sProg').style.strokeDashoffset=785.4*(1-Math.min(1,Math.max(0,p)))}
function loop(now){
  if(!R)return;var dt=Math.min(.25,(now-R.last)/1000);R.last=now;
  if(!R.paused){R.el+=dt*SPEED;tick()}
  if(R&&R.el>=R.total&&!R.paused&&!R.ending){finish();return}
  if(R)R.raf=requestAnimationFrame(loop);
}
function ease(x){return .5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,x)))}
function tick(){
  var r=R,left=r.total-r.el;if(r.type!=='breath')$('sTime').textContent=fmt(left);setProg(r.el/r.total);
  if(r.type==='breath'){
    var ph=r.el%10,inh=ph<5,x=inh?ph/5:1-(ph-5)/5,sec=inh?Math.floor(ph)+1:5-Math.floor(ph-5);
    $('sCore').style.transform='scale('+(0.8+0.2*x).toFixed(3)+')';
    $('sPhase').textContent=inh?'Inspire':'Expire';
    $('sTime').textContent=Math.min(5,Math.max(1,sec));
    $('sClock').textContent=fmt(left);
    $('sCyc').textContent='Cycle '+Math.min(30,Math.floor(r.el/10)+1)+' / 30';
    $('sCap').textContent=inh?'Gonfle doucement le ventre.':'Relâche tout, sans forcer.';
    $('tide').style.height=(x*100).toFixed(2)+'%';$('tide').classList.toggle('out',!inh);
  }else if(r.type==='scan'){
    var f=r.el/r.total;
    for(var i=0;i<SCAN.length;i++){var s=SCAN[i];if(f>=s.a&&(f<s.b||i===SCAN.length-1)){
      $('sPhase').textContent=s.z;
      var seg=(s.b-s.a)*r.total,k=Math.min(s.l.length-1,Math.floor((r.el-s.a*r.total)/(seg/s.l.length)));
      var key=i+'-'+k;if(!r.fired[key]){r.fired[key]=1;$('sCap').textContent=s.l[k];say(s.l[k])}
      break}}
    $('sSub').textContent='';
  }else if(r.type==='pomo'){
    $('sSub').textContent='';
  }
}
function finish(){
  var r=R;r.ending=true;
  if(r.type==='pomo')return pomoDone();
  var type=r.type,min=r.min;cancelAnimationFrame(r.raf);R=null;
  var nb=record(type,min);
  renderEnd(type,min);hist.push('pick');show('end');
  if(nb.length)setTimeout(function(){showBadges(nb)},700);
}
$('sPause').onclick=function(){if(!R)return;R.paused=!R.paused;R.last=performance.now();$('sPause').textContent=R.paused?'▶':'⏸';
  if(R.type==='scan'){$('sCore').classList.toggle('pauseanim',R.paused);if(R.paused)hush()}};
$('sVoice').onclick=function(){VOICE=!VOICE;$('sVoice').textContent=VOICE?'🔊':'🔇';if(!VOICE)hush()};
$('sStop').onclick=function(){if(R&&R.type==='pomo'){pomoReset();return}stopRun();var p=hist.pop();show(p||'pick')};

/* ---------- pomodoro ---------- */
var P={mode:'work',count:0};
var PM={work:{t:1500,chip:'🍅 Travail',ph:'Au travail'},short:{t:300,chip:'☕ Pause',ph:'Pause'},long:{t:900,chip:'🏖️ Grande pause',ph:'Grande pause'}};
function pomoDots(){var h='';for(var i=0;i<4;i++)h+='<i class="'+(i<P.count%4||(P.count>0&&P.count%4===0&&P.mode==='long')?'on':'')+'">'+((i<P.count%4||(P.count>0&&P.count%4===0&&P.mode==='long'))?'🍅':'')+'</i>';$('sDots').innerHTML=h}
function openPomo(){
  P={mode:'work',count:0};
  startRun({type:'pomo',total:PM.work.t,min:25,chip:PM.work.chip,voice:false});
  R.paused=true;$('sPause').textContent='▶';pomoUi();
}
function pomoUi(){
  var m=PM[P.mode];R.total=m.t;R.min=Math.round(m.t/60);$('sChip').textContent=m.chip+' · tomate '+(Math.min(4,(P.mode==='work'?P.count%4:Math.max(0,(P.count-1)%4))+1))+' / 4';
  $('sPhase').textContent=m.ph;$('sCap').textContent=P.mode==='work'?'Une seule tâche. Appuie sur lecture pour démarrer.':'Respire, bois de l’eau, regarde au loin.';
  $('sTime').textContent=fmt(R.total-R.el);setProg(R.el/R.total);$('sNote').textContent='Pause longue après 4 tomates.';pomoDots();
  $('sCore').style.transform='';
}
function chime(){try{var C=window.AudioContext||window.webkitAudioContext,a=new C();[660,880,1100].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+i*.22);g.gain.linearRampToValueAtTime(.18,a.currentTime+i*.22+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.22+.6);o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.22);o.stop(a.currentTime+i*.22+.65)})}catch(e){}}
function pomoDone(){
  var r=R,nb=[];chime();
  if(P.mode==='work'){nb=record('pom',25);P.count++;P.mode=(P.count%4===0)?'long':'short'}
  else{P.mode='work'}
  r.el=0;r.paused=true;r.ending=false;r.last=performance.now();$('sPause').textContent='▶';pomoUi();r.raf=requestAnimationFrame(loop);
  if(nb.length)setTimeout(function(){showBadges(nb)},400);
}
function pomoReset(){if(!R)return;R.el=0;R.paused=true;$('sPause').textContent='▶';pomoUi()}

/* ---------- end of session ---------- */
function renderEnd(type,min){
  var breath=type==='breath';
  var line=breath?'Bravo, tu as pris '+min+' minutes pour réguler ton rythme intérieur.':'Bravo, tu as pris '+min+' minutes pour écouter ton corps.';
  var f4=[['🪷','Plus de calme','grape'],['🌊','Respiration plus posée','sky'],['💡','Esprit clair','sun'],['🍃','Corps plus relâché','leaf']].map(function(x){var c=TINT[x[2]];return '<div style="--bt:'+c[0]+';--bs:'+c[1]+'"><span class="e">'+x[0]+'</span>'+x[1]+'</div>'}).join('');
  var faces=[['😣','Très tendu'],['😕','Plutôt tendu'],['😐','Neutre'],['🙂','Plutôt calme'],['😄','Très calme']].map(function(x,i){return '<button data-i="'+i+'"'+(i===4?' class="on"':'')+'><span class="e">'+x[0]+'</span>'+x[1]+'</button>'}).join('');
  var facts=[['🕐','Durée',min+' min','var(--t-grape)'],[breath?'🌊':'📍',breath?'Cycles':'Zones',breath?'30':'8','var(--t-sky)'],['🧭','Méthode',breath?'3 · 6 · 5':'Scan du corps','var(--t-sun)']].map(function(x){return '<div style="--bt:'+x[3]+'"><span>'+x[0]+' '+x[1]+'</span><b>'+x[2]+'</b></div>'}).join('');
  $('endFit').innerHTML=
   '<div class="endhead"><svg viewBox="0 0 240 240" aria-hidden="true"><use href="#heart"/></svg><div><h1 class="gtext" style="--g:linear-gradient(95deg,#ff5d6c,#f45fb0 55%,#8b5cf6)">Fin de séance</h1><p>'+line+'</p></div></div>'+
   '<div class="card congrats"><h2>Félicitations !</h2><p>Tu as pris soin de toi. Chaque respiration compte, chaque séance te rapproche de ton équilibre.</p></div>'+
   '<div class="card" style="background:#fff"><div class="sect">Ce que tu peux ressentir</div><div class="feel4">'+f4+'</div></div>'+
   '<div class="card" style="background:linear-gradient(160deg,#fff,#eef5ff)"><div class="sect">Ton ressenti</div><div class="faces" id="faces">'+faces+'</div><div class="facts">'+facts+'</div></div>'+
   '<div class="two"><button class="cta sm" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg>Refaire</button><button class="cta alt sm" id="suivi">🏆 Mon profil</button></div>'+
   '<div class="motto">❤️ Régularité + Bienveillance = Transformation</div>';
  $('faces').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call($('faces').children,function(x){x.classList.toggle('on',x===b)})};
  $('again').onclick=function(){hist=hist.filter(function(h){return h!=='end'});var p=hist.pop();show('pick')};
  $('suivi').onclick=function(){hist=['home'];renderProf();show('prof')};
}

  $('modal').classList.add('on');$('mok').onclick=nextBadge;
